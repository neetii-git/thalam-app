# Builds Thalam on a free GitHub-hosted Mac, so the project can be checked
# (and an installable .ipa produced) without owning a Mac.
#
#   build       - every push: iOS Simulator + watchOS Simulator builds, plus an
#                 unsigned device build packaged as .ipa files (Actions > run > Artifacts)
#   testflight  - only when started by hand with "testflight" ticked, and only
#                 with a PAID Apple Developer account (see README, "Route B")

name: Build

on:
  push:
    branches-ignore: [ci-results]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also upload to TestFlight (needs a paid Apple Developer account + secrets)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "::notice::build job uses $(xcodebuild -version | tr '\n' ' ') from $XCODE; installed: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphone|watch"

      - name: Make sure the watchOS Simulator is installed
        run: |
          if ! xcrun simctl list runtimes | grep -q watchOS; then
            echo "watchOS Simulator runtime missing - downloading it"
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes

      # Exactly what README tells you to run on a Mac (downloads XcodeGen, no Homebrew).
      - name: ./build.sh (generate + Simulator builds)
        run: ./build.sh

      - name: Build for real devices (unsigned)
        run: |
          xcodebuild -project Thalam.xcodeproj -scheme Thalam -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Package .ipa files
        run: |
          APP="build/device/Build/Products/Release-iphoneos/Thalam.app"
          echo "Watch app embedded at:"; ls "$APP/Watch"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Thalam-with-watch-unsigned.ipa Payload)
          # Free-Apple-ID sideloading tools can't install Watch apps, so also
          # make an iPhone-only copy (use "Also tap on this iPhone" mode).
          rm -rf build/ipa/Payload/Thalam.app/Watch
          (cd build/ipa && zip -qry ../Thalam-iphone-only-unsigned.ipa Payload)
          ls -lh build/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Thalam-ipa
          path: build/*.ipa
          retention-days: 14

  # Runs the unit tests (tala patterns, startAt maths, real beat-timing
  # accuracy) and takes screenshots of both apps in the Simulators.
  simulator:
    # Intel runner: the Apple Silicon (macos-26) pool kept failing to pick this job up.
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: write   # pushes test log + screenshots to the ci-results branch
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulators
        run: |
          echo "IPHONE=$(python3 tools/pick_simulator.py iOS iPhone)" >> "$GITHUB_ENV"
          echo "WATCH=$(python3 tools/pick_simulator.py watchOS 'Apple Watch')" >> "$GITHUB_ENV"

      - name: Unit tests (incl. 15 s beat-timing test)
        id: tests
        continue-on-error: true   # still take screenshots; the job fails at the end
        run: |
          mkdir -p build
          xcodebuild -project Thalam.xcodeproj -scheme Thalam \
            -destination "id=$IPHONE" -derivedDataPath build/test \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/test.log | grep -E "Test Case|BEAT TIMING|error:|\*\* TEST" || true
          # Annotations are readable through the API even where log downloads aren't.
          grep -E "BEAT TIMING" build/test.log | head -3 | sed 's/^/::notice::/' || true
          grep -E "error:|Test Case .* failed|\*\* TEST FAILED" build/test.log | head -15 | cut -c1-400 | sed 's/^/::error::/' || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - name: Build apps for the Simulators
        run: |
          xcodebuild -project Thalam.xcodeproj -scheme Thalam \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Screenshots
        run: |
          mkdir -p shots
          PRODUCTS=build/sim/Build/Products
          xcrun simctl boot "$IPHONE" || true
          xcrun simctl boot "$WATCH" || true
          xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl bootstatus "$WATCH" -b
          xcrun simctl status_bar "$IPHONE" override --time 9:41 || true
          xcrun simctl install "$IPHONE" "$PRODUCTS/Debug-iphonesimulator/Thalam.app"
          xcrun simctl install "$WATCH" "$PRODUCTS/Debug-watchsimulator/Thalam Watch App.app"

          xcrun simctl launch "$IPHONE" com.eshan.thalam
          sleep 15   # first launch on the Intel runner is slow
          xcrun simctl io "$IPHONE" screenshot shots/1-iphone-setup.png
          xcrun simctl terminate "$IPHONE" com.eshan.thalam
          xcrun simctl launch "$IPHONE" com.eshan.thalam -autostart
          sleep 5
          xcrun simctl io "$IPHONE" screenshot shots/2-iphone-playing.png

          xcrun simctl launch "$WATCH" com.eshan.thalam.watchkitapp
          sleep 6
          xcrun simctl io "$WATCH" screenshot shots/3-watch-idle.png
          xcrun simctl terminate "$WATCH" com.eshan.thalam.watchkitapp
          xcrun simctl launch "$WATCH" com.eshan.thalam.watchkitapp -autostart
          sleep 4
          xcrun simctl io "$WATCH" screenshot shots/4-watch-playing.png
          sleep 0.4
          xcrun simctl io "$WATCH" screenshot shots/5-watch-playing.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Thalam-screenshots-and-tests
          path: |
            shots/
            build/test.log
          retention-days: 14

      - name: Publish results to the ci-results branch
        if: always()
        run: |
          mkdir -p out && cp -R shots out/ 2>/dev/null || true
          cp build/test.log out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b ci-results
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI results for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results

      - name: Fail if the unit tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 TEAM_ID; do
            if [ -z "${!name}" ]; then echo "Missing repository secret $name (see README)"; exit 1; fi
          done

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive (signed automatically in the cloud)
        run: |
          xcodebuild -project Thalam.xcodeproj -scheme Thalam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Thalam.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet archive

      - name: Upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Thalam.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
